<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Lumière dans l'Ombre</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a1a">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      touch-action: none;
      user-select: none;
    }
    #gameCanvas {
      border-radius: 8px;
      box-shadow: 0 0 60px rgba(255, 200, 50, 0.15);
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 20, 0.92);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid rgba(255, 200, 50, 0.3);
      text-align: center;
      pointer-events: auto;
    }
    .screen.active { display: flex; }
    .screen h1 {
      color: #ffd54f;
      font-size: 1.8rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255, 200, 50, 0.5);
    }
    .screen p {
      color: #aaa;
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .screen button {
      padding: 14px 36px;
      font-size: 1.1rem;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #ffd54f, #ff8f00);
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 180, 0, 0.3);
    }
    .screen button:active { transform: scale(0.95); }
    #hud {
      position: absolute;
      top: 10px; left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      color: #ffd54f;
      font-size: 0.85rem;
      text-shadow: 0 0 8px rgba(255, 200, 50, 0.5);
      pointer-events: none;
      z-index: 10;
    }
    #touch-controls {
      position: absolute;
      bottom: 15px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 15px;
      pointer-events: none;
      z-index: 10;
    }
    .ctrl-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .ctrl-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 200, 50, 0.12);
      border: 2px solid rgba(255, 200, 50, 0.3);
      color: #ffd54f;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active {
      background: rgba(255, 200, 50, 0.3);
      border-color: rgba(255, 200, 50, 0.6);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <span id="hud-lives">✦ ✦ ✦</span>
    <span id="hud-level">Niveau 1</span>
    <span id="hud-score">0</span>
  </div>

  <div id="touch-controls">
    <div class="ctrl-group">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-btn" id="btn-jump">▲</div>
    </div>
  </div>

  <div id="ui-overlay">
    <div class="screen active" id="screen-menu">
      <h1>✦ Lumière dans l'Ombre</h1>
      <p>Tu es une étincelle perdue dans le vide.<br>
      Attrape les éclats de lumière.<br>
      Évite les ombres.<br>
      Trouve le portail.</p>
      <button id="btn-start">Commencer</button>
    </div>
    <div class="screen" id="screen-level">
      <h1 id="level-title">Niveau 2</h1>
      <p id="level-msg">Le vide s'approfondit…</p>
      <button id="btn-next">Continuer</button>
    </div>
    <div class="screen" id="screen-gameover">
      <h1>L'ombre t'a englouti…</h1>
      <p id="final-score">Score : 0</p>
      <button id="btn-retry">Réessayer</button>
    </div>
    <div class="screen" id="screen-win">
      <h1>✦ Tu as retrouvé la Lumière ✦</h1>
      <p id="win-score">Score final : 0</p>
      <button id="btn-again">Rejouer</button>
    </div>
  </div>

<script>
// ==================== SETUP ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = Math.min(window.innerWidth, 480);
  canvas.height = Math.min(window.innerHeight - 10, 700);
}
resize();
window.addEventListener('resize', resize);

// ==================== AUDIO ====================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type='sine', vol=0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function sfxJump() { playSound(400, 0.15, 'sine', 0.1); }
function sfxCollect() { playSound(880, 0.2, 'sine', 0.12); playSound(1320, 0.3, 'sine', 0.08); }
function sfxHurt() { playSound(150, 0.3, 'sawtooth', 0.15); }
function sfxWin() { playSound(523, 0.2, 'sine', 0.12); setTimeout(()=>playSound(659, 0.2, 'sine', 0.12), 150); setTimeout(()=>playSound(784, 0.4, 'sine', 0.12), 300); }
function sfxDie() { playSound(200, 0.4, 'sawtooth', 0.12); playSound(100, 0.6, 'sawtooth', 0.1); }

// ==================== PARTICLES ====================
let particles = [];
function spawnParticles(x, y, color, count=8, speed=3) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * speed + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      color,
      size: 2 + Math.random() * 3
    });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ==================== GAME STATE ====================
const STATE = { MENU: 0, PLAYING: 1, LEVEL_INTRO: 2, GAMEOVER: 3, WIN: 4 };
let gameState = STATE.MENU;
let score = 0;
let lives = 3;
let currentLevel = 0;
let camera = { x: 0, y: 0 };
let invincibleTimer = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

const player = {
  x: 100, y: 100,
  vx: 0, vy: 0,
  w: 28, h: 28,
  speed: 4,
  jumpForce: -11,
  onGround: false,
  facing: 1,
  glowPhase: 0
};

const GRAVITY = 0.55;
const FRICTION = 0.85;

// ==================== LEVELS ====================
function generateLevels() {
  return [
    {
      platforms: [
        { x: 0, y: 580, w: 400, h: 30 },
        { x: 300, y: 480, w: 150, h: 20 },
        { x: 500, y: 400, w: 120, h: 20 },
        { x: 680, y: 320, w: 150, h: 20 },
        { x: 880, y: 400, w: 120, h: 20 },
        { x: 1050, y: 480, w: 200, h: 30 },
        { x: 1300, y: 400, w: 100, h: 20 },
        { x: 1450, y: 320, w: 150, h: 20 },
        { x: 1650, y: 400, w: 200, h: 30 },
      ],
      collectibles: [
        { x: 350, y: 440 }, { x: 540, y: 360 }, { x: 740, y: 280 },
        { x: 920, y: 360 }, { x: 1120, y: 440 }, { x: 1340, y: 360 }, { x: 1500, y: 280 }
      ],
      enemies: [
        { x: 500, y: 550, patrol: 100, dir: 1, speed: 1.5 },
        { x: 1100, y: 550, patrol: 80, dir: 1, speed: 2 },
      ],
      exit: { x: 1750, y: 350 },
      playerStart: { x: 60, y: 520 },
      width: 1900
    },
    {
      platforms: [
        { x: 0, y: 580, w: 250, h: 30 },
        { x: 200, y: 470, w: 100, h: 20 },
        { x: 380, y: 380, w: 100, h: 20 },
        { x: 550, y: 300, w: 80, h: 20 },
        { x: 720, y: 380, w: 100, h: 20 },
        { x: 900, y: 470, w: 100, h: 20 },
        { x: 1050, y: 380, w: 80, h: 20 },
        { x: 1200, y: 300, w: 100, h: 20 },
        { x: 1380, y: 380, w: 100, h: 20 },
        { x: 1550, y: 470, w: 120, h: 20 },
        { x: 1730, y: 400, w: 150, h: 30 },
      ],
      collectibles: [
        { x: 240, y: 430 }, { x: 420, y: 340 }, { x: 580, y: 260 },
        { x: 760, y: 340 }, { x: 940, y: 430 }, { x: 1080, y: 340 },
        { x: 1240, y: 260 }, { x: 1420, y: 340 }, { x: 1600, y: 430 }
      ],
      enemies: [
        { x: 400, y: 550, patrol: 120, dir: 1, speed: 2 },
        { x: 800, y: 550, patrol: 100, dir: -1, speed: 2.5 },
        { x: 1250, y: 550, patrol: 130, dir: 1, speed: 2 },
        { x: 1600, y: 550, patrol: 90, dir: -1, speed: 2.5 },
      ],
      exit: { x: 1810, y: 350 },
      playerStart: { x: 50, y: 520 },
      width: 1950
    },
    {
      platforms: [
        { x: 0, y: 580, w: 200, h: 30 },
        { x: 180, y: 480, w: 80, h: 20 },
        { x: 340, y: 400, w: 70, h: 20 },
        { x: 490, y: 320, w: 70, h: 20 },
        { x: 640, y: 250, w: 70, h: 20 },
        { x: 790, y: 320, w: 70, h: 20 },
        { x: 940, y: 400, w: 70, h: 20 },
        { x: 1090, y: 480, w: 70, h: 20 },
        { x: 1240, y: 400, w: 70, h: 20 },
        { x: 1390, y: 320, w: 70, h: 20 },
        { x: 1540, y: 250, w: 70, h: 20 },
        { x: 1690, y: 320, w: 70, h: 20 },
        { x: 1840, y: 400, w: 80, h: 20 },
        { x: 2000, y: 480, w: 150, h: 30 },
      ],
      collectibles: [
        { x: 210, y: 440 }, { x: 370, y: 360 }, { x: 520, y: 280 },
        { x: 670, y: 210 }, { x: 820, y: 280 }, { x: 970, y: 360 },
        { x: 1120, y: 440 }, { x: 1270, y: 360 }, { x: 1420, y: 280 },
        { x: 1570, y: 210 }, { x: 1720, y: 280 }, { x: 1880, y: 360 }
      ],
      enemies: [
        { x: 350, y: 550, patrol: 100, dir: 1, speed: 2.5 },
        { x: 700, y: 550, patrol: 120, dir: -1, speed: 3 },
        { x: 1100, y: 550, patrol: 100, dir: 1, speed: 2.5 },
        { x: 1500, y: 550, patrol: 110, dir: -1, speed: 3 },
        { x: 1900, y: 550, patrol: 80, dir: 1, speed: 3.5 },
      ],
      exit: { x: 2080, y: 430 },
      playerStart: { x: 50, y: 520 },
      width: 2200
    }
  ];
}

let levels = generateLevels();
let currentPlatforms = [];
let currentCollectibles = [];
let currentEnemies = [];
let currentExit = null;

function loadLevel(idx) {
  const lvl = levels[idx];
  currentPlatforms = lvl.platforms.map(p => ({ ...p }));
  currentCollectibles = lvl.collectibles.map(c => ({ ...c, collected: false, phase: Math.random() * Math.PI * 2 }));
  currentEnemies = lvl.enemies.map(e => ({ ...e, startX: e.x }));
  currentExit = { ...lvl.exit, phase: 0 };
  player.x = lvl.playerStart.x;
  player.y = lvl.playerStart.y;
  player.vx = 0;
  player.vy = 0;
  invincibleTimer = 60;
  particles = [];
  camera.x = 0;
}

// ==================== INPUT ====================
const keys = { left: false, right: false, jump: false };

function bindTouch(id, key) {
  const el = document.getElementById(id);
  const start = (e) => { e.preventDefault(); keys[key] = true; };
  const end = (e) => { e.preventDefault(); keys[key] = false; };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('touchcancel', end, { passive: false });
}
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'jump');

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') { keys.jump = true; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') keys.jump = false;
});

// ==================== UI ====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (id) document.getElementById(id).classList.add('active');
}

function updateHUD() {
  document.getElementById('hud-lives').textContent = '✦ '.repeat(lives).trim() || '—';
  document.getElementById('hud-level').textContent = 'Niveau ' + (currentLevel + 1);
  document.getElementById('hud-score').textContent = score;
}

// ==================== GAME LOGIC ====================
function update() {
  if (gameState !== STATE.PLAYING) return;

  const lvl = levels[currentLevel];

  if (keys.left) { player.vx -= player.speed * 0.3; player.facing = -1; }
  if (keys.right) { player.vx += player.speed * 0.3; player.facing = 1; }
  player.vx *= FRICTION;
  player.vx = Math.max(-player.speed, Math.min(player.speed, player.vx));

  if (keys.jump && player.onGround) {
    player.vy = player.jumpForce;
    player.onGround = false;
    sfxJump();
    spawnParticles(player.x + player.w/2, player.y + player.h, '#ffd54f', 5, 2);
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;

  currentPlatforms.forEach(p => {
    if (player.x + player.w > p.x && player.x < p.x + p.w &&
        player.y + player.h > p.y && player.y + player.h < p.y + p.h + 15 &&
        player.vy >= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
    if (player.y + player.h > p.y + 5 && player.y < p.y + p.h - 5) {
      if (player.x + player.w > p.x && player.x < p.x + 10 && player.vx > 0) {
        player.x = p.x - player.w;
        player.vx = 0;
      }
      if (player.x < p.x + p.w && player.x + player.w < p.x + p.w - 5 && player.vx < 0) {
        player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  });

  if (player.y > 700) takeDamage();

  currentCollectibles.forEach(c => {
    if (c.collected) return;
    c.phase += 0.05;
    const cy = c.y + Math.sin(c.phase) * 5;
    const dx = (player.x + player.w/2) - c.x;
    const dy = (player.y + player.h/2) - cy;
    if (Math.sqrt(dx*dx + dy*dy) < 25) {
      c.collected = true;
      score += 50;
      sfxCollect();
      spawnParticles(c.x, cy, '#ffd54f', 12, 4);
      updateHUD();
    }
  });

  currentEnemies.forEach(e => {
    e.x += e.speed * e.dir;
    if (e.x > e.startX + e.patrol || e.x < e.startX - e.patrol) e.dir *= -1;
    if (invincibleTimer <= 0) {
      const dx = (player.x + player.w/2) - e.x;
      const dy = (player.y + player.h/2) - (e.y - 14);
      if (Math.sqrt(dx*dx + dy*dy) < 28) takeDamage();
    }
  });

  if (currentExit) {
    currentExit.phase += 0.03;
    const dx = (player.x + player.w/2) - currentExit.x;
    const dy = (player.y + player.h/2) - currentExit.y;
    if (Math.sqrt(dx*dx + dy*dy) < 35) {
      score += 200;
      sfxWin();
      if (currentLevel < levels.length - 1) {
        currentLevel++;
        gameState = STATE.LEVEL_INTRO;
        document.getElementById('level-title').textContent = 'Niveau ' + (currentLevel + 1);
        const msgs = ['Le vide s\'approfondit…', 'Les ombres se renforcent…', 'La Lumière est proche…'];
        document.getElementById('level-msg').textContent = msgs[currentLevel - 1] || '…';
        showScreen('screen-level');
      } else {
        gameState = STATE.WIN;
        document.getElementById('win-score').textContent = 'Score final : ' + score;
        showScreen('screen-win');
      }
      updateHUD();
    }
  }

  if (invincibleTimer > 0) invincibleTimer--;
  if (shakeTimer > 0) shakeTimer--;

  const targetX = player.x + player.w/2 - canvas.width/2;
  const targetY = player.y + player.h/2 - canvas.height/2;
  camera.x += (targetX - camera.x) * 0.08;
  camera.y += (targetY - camera.y) * 0.08;
  camera.x = Math.max(0, Math.min(camera.x, lvl.width - canvas.width));
  camera.y = Math.max(-100, Math.min(camera.y, 100));

  player.glowPhase += 0.08;
  updateParticles();
}

function takeDamage() {
  if (invincibleTimer > 0) return;
  lives--;
  sfxHurt();
  shakeTimer = 15;
  shakeIntensity = 5;
  invincibleTimer = 90;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff5252', 15, 5);
  updateHUD();
  if (lives <= 0) {
    gameState = STATE.GAMEOVER;
    sfxDie();
    document.getElementById('final-score').textContent = 'Score : ' + score;
    showScreen('screen-gameover');
  } else {
    const lvl = levels[currentLevel];
    player.x = lvl.playerStart.x;
    player.y = lvl.playerStart.y;
    player.vx = 0;
    player.vy = 0;
  }
}

// ==================== RENDERING ====================
function draw() {
  ctx.save();

  if (shakeTimer > 0) {
    const sx = (Math.random() - 0.5) * shakeIntensity;
    const sy = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(sx, sy);
  }

  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(1, '#1a1030');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 137 + 50) % canvas.width;
    const sy = (i * 97 + 30) % canvas.height;
    const ss = (Math.sin(Date.now() * 0.001 + i) + 1) * 0.5 + 0.5;
    ctx.globalAlpha = 0.2 + ss * 0.3;
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;

  ctx.translate(-camera.x, -camera.y);

  currentPlatforms.forEach(p => {
    const pGrad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    pGrad.addColorStop(0, '#3a3a5c');
    pGrad.addColorStop(1, '#1a1a30');
    ctx.fillStyle = pGrad;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = 'rgba(255, 200, 50, 0.15)';
    ctx.fillRect(p.x, p.y, p.w, 3);
    ctx.strokeStyle = 'rgba(100, 100, 180, 0.3)';
    ctx.strokeRect(p.x, p.y, p.w, p.h);
  });

  currentCollectibles.forEach(c => {
    if (c.collected) return;
    const cy = c.y + Math.sin(c.phase) * 5;
    const glow = (Math.sin(Date.now() * 0.005 + c.phase) + 1) * 0.5;
    ctx.shadowColor = '#ffd54f';
    ctx.shadowBlur = 10 + glow * 10;
    ctx.fillStyle = `rgba(255, 213, 79, ${0.7 + glow * 0.3})`;
    ctx.beginPath();
    ctx.arc(c.x, cy, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(c.x, cy, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  currentEnemies.forEach(e => {
    const ey = e.y - 14;
    const wobble = Math.sin(Date.now() * 0.01 + e.x) * 3;
    ctx.shadowColor = '#7c4dff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = 'rgba(80, 30, 120, 0.8)';
    ctx.beginPath();
    ctx.ellipse(e.x, ey + wobble, 16, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff5252';
    ctx.shadowColor = '#ff5252';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(e.x - 5, ey + wobble - 4, 3, 0, Math.PI * 2);
    ctx.arc(e.x + 5, ey + wobble - 4, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  if (currentExit) {
    const ep = currentExit.phase;
    const pulse = (Math.sin(ep) + 1) * 0.5;
    ctx.shadowColor = '#4fc3f7';
    ctx.shadowBlur = 20 + pulse * 20;
    ctx.strokeStyle = `rgba(79, 195, 247, ${0.5 + pulse * 0.5})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(currentExit.x, currentExit.y, 25 + pulse * 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(79, 195, 247, ${0.3 + pulse * 0.3})`;
    ctx.beginPath();
    ctx.arc(currentExit.x, currentExit.y, 15 + pulse * 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(79, 195, 247, ${0.3 + pulse * 0.4})`;
    ctx.beginPath();
    ctx.arc(currentExit.x, currentExit.y, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  const px = player.x + player.w/2;
  const py = player.y + player.h/2;
  const glow = (Math.sin(player.glowPhase) + 1) * 0.5;
  const alpha = invincibleTimer > 0 ? (Math.sin(Date.now() * 0.02) > 0 ? 1 : 0.3) : 1;
  ctx.globalAlpha = alpha;

  ctx.shadowColor = '#ffd54f';
  ctx.shadowBlur = 20 + glow * 15;
  ctx.fillStyle = `rgba(255, 213, 79, 0.9)`;
  ctx.beginPath();
  ctx.arc(px, py, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px, py, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.arc(px + player.facing * 8, py - 2, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  drawParticles();
  ctx.restore();
}

// ==================== GAME LOOP ====================
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ==================== BUTTONS ====================
document.getElementById('btn-start').addEventListener('click', () => { initAudio(); startGame(); });
document.getElementById('btn-next').addEventListener('click', () => { loadLevel(currentLevel); gameState = STATE.PLAYING; showScreen(null); });
document.getElementById('btn-retry').addEventListener('click', () => { startGame(); });
document.getElementById('btn-again').addEventListener('click', () => { startGame(); });

function startGame() {
  score = 0;
  lives = 3;
  currentLevel = 0;
  loadLevel(0);
  gameState = STATE.PLAYING;
  showScreen(null);
  updateHUD();
}

showScreen('screen-menu');
gameLoop();
</script>
